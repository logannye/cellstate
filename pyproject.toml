[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "cellstate"
version = "0.2.0"
description = "Query-conditioned belief-state contracts and reference models for virtual-cell research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Logan Nye" }]
keywords = ["single-cell", "virtual-cell", "state-estimation", "bayesian-filtering"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.10,<3",
  "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.5.0",
  # starlette's TestClient needs an HTTP client; it prefers httpx2 and only falls back to httpx
  # with a deprecation warning.
  "httpx2>=0.28",
  "hypothesis>=6.165.3",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.16.2",
]
docs = [
  "mkdocs>=1.6,<2",
]
sciplex3 = [
  "h5py>=3.11,<4",
]
# The local web UI. Optional, because a research package should not carry a web server for
# everyone who only wants an estimator.
ui = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cellstate"]

# The committed GSE274113 slice travels with the wheel (336 KB).  Without this the flagship
# backend imports cleanly and then cannot answer a single question, because `artifact_directory`
# has no `backends/` tree to resolve -- which is the state every installed-package consumer was in.
#
# ⚠️ **The destination is deliberately NOT under `cellstate/`, and moving it back breaks editable
# installs.**  Hatchling applies `force-include` to editable installs too, where the package's own
# modules live in `src/` and only the force-included files land in `site-packages`.  A destination
# of `cellstate/backends/gse274113/_slice` therefore left exactly two JSON files there, which made
# `cellstate`, `cellstate.backends` and `cellstate.backends.gse274113` **namespace packages that
# shadow the source tree** -- `from cellstate.backends import X` then failed with
# `(unknown location)` while `import cellstate` still worked, and which entry points broke flipped
# between runs because `uv run` re-syncs.  A sibling destination carries the same bytes to the same
# consumers and cannot shadow a module path.  See `test_the_wheel_ships_the_slice_outside_the_package`.
[tool.hatch.build.targets.wheel.force-include]
"backends/vertical-a/gse274113-rna-obs-v1" = "cellstate_gse274113_slice"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=cellstate --cov-report=term-missing --cov-fail-under=85"
pythonpath = ["src"]
testpaths = ["tests", "audits/item12_1a"]

[tool.coverage.run]
branch = true
source = ["cellstate"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  '\.\.\.',
  "raise NotImplementedError",
]

[tool.ruff]
extend-exclude = ["audits/item12_1a/*.py"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["cellstate"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
