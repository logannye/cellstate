name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev --no-editable
      - run: uv run --no-editable ruff format --check .
      - run: uv run --no-editable ruff check .
      - name: Type check on minimum supported Python
        if: matrix.python-version == '3.11'
        run: uv run --no-editable mypy src
      - name: Test with coverage on the reference runtime
        if: matrix.python-version == '3.11'
        run: uv run --no-editable pytest
      - name: Test on compatibility runtimes
        if: matrix.python-version != '3.11'
        run: uv run --no-editable pytest --no-cov
      - run: uv run --no-editable python scripts/export_schemas.py
      - run: git diff --exit-code -- schemas
      # The real-cell path, against the INSTALLED package. `pythonpath = ["src"]` means no test
      # ever imports the wheel, so nothing here could see that the wheel shipped without the
      # committed slice -- the flagship backend imported cleanly and then answered nothing.
      - name: Estimate a real cell state from the installed package
        run: uv run --no-editable --reinstall-package cellstate python examples/estimate_real_cell_state.py
      - name: Screen the substrate the backend is fitted on
        run: |
          uv run python scripts/explore.py knockdown
          uv run python scripts/explore.py spectrum
      - run: uv build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --extra docs --no-editable
      - run: uv run --no-editable mkdocs build --strict

  item12-v5-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: docker/setup-buildx-action@v3
        with:
          version: v0.28.0
          driver-opts: >-
            image=moby/buildkit@sha256:6eceb8971ce4fceb3daca562832642706238b7eea72941fcf9896c93c3c4a53e
      - run: uv sync --extra dev --no-editable
      - name: Verify frozen Item 12.2 runtime inputs
        run: >-
          uv run --no-editable python scripts/verify_sciplex3_v5_runtime_oci.py
          --lock containers/sciplex3-v5-runtime/runtime-image-lock.json
          verify-inputs --context containers/sciplex3-v5-runtime
      - name: Verify frozen Item 12.2 runtime builder
        run: >-
          uv run --no-editable python scripts/verify_sciplex3_v5_runtime_oci.py
          --lock containers/sciplex3-v5-runtime/runtime-image-lock.json
          verify-builder
      - name: Build first source-free OCI runtime
        run: |
          source_date_epoch="$(uv run --no-editable python \
            scripts/verify_sciplex3_v5_runtime_oci.py \
            --lock containers/sciplex3-v5-runtime/runtime-image-lock.json \
            source-date-epoch)"
          docker buildx build \
            --no-cache \
            --provenance=false \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --output "type=oci,dest=${RUNNER_TEMP}/sciplex3-v5-runtime-a.oci.tar" \
            --tag cellstate-sciplex3-v5-runtime:20260811-locked \
            containers/sciplex3-v5-runtime
      - name: Build second independent source-free OCI runtime
        run: |
          source_date_epoch="$(uv run --no-editable python \
            scripts/verify_sciplex3_v5_runtime_oci.py \
            --lock containers/sciplex3-v5-runtime/runtime-image-lock.json \
            source-date-epoch)"
          docker buildx build \
            --no-cache \
            --provenance=false \
            --platform linux/amd64 \
            --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --output "type=oci,dest=${RUNNER_TEMP}/sciplex3-v5-runtime-b.oci.tar" \
            --tag cellstate-sciplex3-v5-runtime:20260811-locked \
            containers/sciplex3-v5-runtime
      - name: Verify both OCI identities against the runtime lock
        run: >-
          uv run --no-editable python scripts/verify_sciplex3_v5_runtime_oci.py
          --lock containers/sciplex3-v5-runtime/runtime-image-lock.json
          verify-archives
          --archive "${RUNNER_TEMP}/sciplex3-v5-runtime-a.oci.tar"
          --archive "${RUNNER_TEMP}/sciplex3-v5-runtime-b.oci.tar"
      - name: Upload verified native-amd64 OCI reproduction witness
        uses: actions/upload-artifact@v4
        with:
          name: sciplex3-v5-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/sciplex3-v5-runtime-a.oci.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Set up OCI-capable Docker runtime daemon
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5
        with:
          version: v29.7.2
          set-host: false
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Verify OCI-capable Docker runtime daemon
        run: |
          test "$(docker context show)" = "setup-docker-action"
          test "$(docker version --format '{{.Server.Version}}')" = "29.7.2"
          docker info --format '{{json .DriverStatus}}' \
            | grep -Fq '"io.containerd.snapshotter.v1"'
      - name: Load and verify the exact locked linux/amd64 image
        run: |
          docker load --input "${RUNNER_TEMP}/sciplex3-v5-runtime-a.oci.tar"
          uv run --no-editable python scripts/verify_sciplex3_v5_runtime_oci.py \
            --lock containers/sciplex3-v5-runtime/runtime-image-lock.json \
            verify-loaded-image
      - name: Run source-free real-Docker containment probes
        run: >-
          uv run --no-editable pytest -q tests/real_docker_item12_2.py --no-cov
